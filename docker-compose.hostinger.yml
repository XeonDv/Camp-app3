services:
  api:
    image: camp-api:latest
    container_name: camp-api
    restart: unless-stopped
    ports:
      - "${CAMP_API_PORT:-3006}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.ylcamp.com}
    networks:
      - homebor-net

networks:
  homebor-net:
    external: true
